<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gold outer ring -->
  <circle cx="100" cy="100" r="99" fill="#D4AF37"/>
  <!-- Red body -->
  <circle cx="100" cy="100" r="90" fill="#8B0000"/>
  <!-- Inner gold rings -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <circle cx="100" cy="100" r="63" fill="none" stroke="#D4AF37" stroke-width="1.2"/>

  <defs>
    <!-- CW from left through TOP -->
    <path id="topArc" d="M 15,100 A 85,85 0 0,1 185,100"/>
    <!-- CCW from left through BOTTOM -->
    <path id="botArc" d="M 18,100 A 82,82 0 0,0 182,100"/>
  </defs>

  <!-- HỌ NGÔ -->
  <text font-size="14.5" font-family="'Arial Black',Arial,sans-serif" font-weight="900" fill="#D4AF37" letter-spacing="4">
    <textPath href="#topArc" startOffset="19%">HỌ NGÔ</textPath>
  </text>

  <!-- VIỆT NAM -->
  <text font-size="13.5" font-family="'Arial Black',Arial,sans-serif" font-weight="900" fill="#D4AF37" letter-spacing="3">
    <textPath href="#botArc" startOffset="21%">VIỆT NAM</textPath>
  </text>

  <!-- Stars -->
  <text x="19" y="105" text-anchor="middle" fill="#D4AF37" font-size="13">★</text>
  <text x="181" y="105" text-anchor="middle" fill="#D4AF37" font-size="13">★</text>

  <!-- 吳 character -->
  <text x="100" y="120" text-anchor="middle" fill="#D4AF37" font-size="62" font-family="'Noto Serif SC',STSong,serif" font-weight="700">吳</text>
</svg>
