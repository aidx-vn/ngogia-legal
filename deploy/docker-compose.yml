name: ngogia-legal

networks:
  proxy_net:
    external: true

services:
  web:
    image: ghcr.io/${GITHUB_ORG}/ngogia-legal:${APP_VERSION:-latest}
    container_name: ngogia-web
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ngogia.rule=Host(`ngogia.aidx.vn`)"
      - "traefik.http.routers.ngogia.entrypoints=websecure"
      - "traefik.http.routers.ngogia.tls.certresolver=letsencrypt"
      - "traefik.http.services.ngogia.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"
